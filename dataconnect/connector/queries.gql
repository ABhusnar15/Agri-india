# Firebase Data Connect Queries & Mutations

# 1. Fetch Mandi Prices by State
query GetMandiPricesByState($state: String!) @auth(level: PUBLIC) {
  mandiPrices(where: { state: { eq: $state } }) {
    id
    commodity
    commodityHi
    state
    district
    mandiName
    minPrice
    maxPrice
    modalPrice
    unit
    priceChange
    lastUpdated
  }
}

# 2. Get All Community Posts
query GetCommunityPosts @auth(level: PUBLIC) {
  communityPosts(orderBy: [{ createdAt: DESC }]) {
    id
    authorName
    authorState
    timeAgo
    category
    content
    contentHi
    likesCount
    commentsCount
    isVerifiedExpert
  }
}

# 3. Create Community Post
mutation CreateCommunityPost(
  $id: String!
  $authorName: String!
  $authorState: String!
  $category: String!
  $content: String!
  $contentHi: String
) @auth(level: USER) {
  communityPost_insert(
    data: {
      id: $id
      authorName: $authorName
      authorState: $authorState
      category: $category
      content: $content
      contentHi: $contentHi
      likesCount: 0
      commentsCount: 0
      isVerifiedExpert: false
    }
  )
}

# 4. Upsert User Profile
mutation UpsertUser(
  $uid: String!
  $name: String!
  $email: String!
  $phone: String
  $state: String
) @auth(level: USER) {
  user_upsert(
    data: {
      uid: $uid
      name: $name
      email: $email
      phone: $phone
      state: $state
    }
  )
}
