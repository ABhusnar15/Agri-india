# Firebase Data Connect GraphQL Schema for AgriIndiaApp

type User @table {
  uid: String! @primaryKey
  name: String!
  email: String!
  phone: String
  state: String
  profileImageUrl: String
  createdAt: Timestamp @default(expr: "request.time")
}

type Product @table {
  id: String! @primaryKey
  name: String!
  nameHi: String!
  category: String!
  price: Float!
  originalPrice: Float!
  rating: Float @default(value: 4.5)
  reviewCount: Int @default(value: 0)
  isSubsidyAvailable: Boolean @default(value: false)
  subsidyTag: String
  seller: String!
  description: String
}

type Order @table {
  orderId: String! @primaryKey
  user: User!
  totalAmount: Float!
  paymentId: String!
  paymentStatus: String! @default(value: "Paid")
  createdAt: Timestamp @default(expr: "request.time")
}

type OrderItem @table {
  id: String! @primaryKey
  order: Order!
  product: Product
  productName: String!
  quantity: Int! @default(value: 1)
  pricePerUnit: Float!
}

type MandiPrice @table {
  id: String! @primaryKey
  commodity: String!
  commodityHi: String!
  state: String!
  district: String!
  mandiName: String!
  minPrice: Int!
  maxPrice: Int!
  modalPrice: Int!
  unit: String @default(value: "Quintal")
  priceChange: Int @default(value: 0)
  lastUpdated: String
}

type CommunityPost @table {
  id: String! @primaryKey
  user: User
  authorName: String!
  authorState: String!
  timeAgo: String
  category: String!
  content: String!
  contentHi: String
  likesCount: Int @default(value: 0)
  commentsCount: Int @default(value: 0)
  isVerifiedExpert: Boolean @default(value: false)
  createdAt: Timestamp @default(expr: "request.time")
}

type PostComment @table {
  id: String! @primaryKey
  post: CommunityPost!
  authorName: String!
  commentText: String!
  createdAt: Timestamp @default(expr: "request.time")
}
